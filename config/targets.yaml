# Lunar Ice Explorer — Target Configuration
# created_by_agent
# All spatial values in degrees; radius in km; RPI dimensionless.

targets:
  - name: shackleton
    description: "Shackleton Crater — primary south pole ice prospect"
    lat: -89.9
    lon: 0.0
    radius_km: 20.0

rpi:
  threshold: 1.5
  slope_clamp_min_deg: 0.1        # denominator clamp to avoid division by zero
  min_pass_count: 3               # cells with fewer passes flagged low_confidence
  mock_slope_deg: 2.0             # PSR floors typically 1–3°; replaced by LOLA DEM in v0.04

lend:
  dataset_id: "LRO-L-LEND-*"
  primary_product: "LEND_RDR_RSCI"   # Reduced Science — binary rows with lat/lon + neutron spectra
  channel: "SETN"
  collimated_channel: "CSETN"        # 9 km resolution — preferred for Gold PSR map
  release: 65
  setn_baseline_june2010:
    c_baseline: 12.9864              # AVG(setn_total) over 71,327 silver rows, June 2010
    c_stddev:    4.1197              # STDDEV(setn_total) — signal variance reference
    row_count:  71327                # confirmed 2026-05-10 run
    source: "lunar_ice.south_pole.silver_lend_targets"

lola:
  resolution_m_per_px: 40                    # ldem_85s_40m_float.img — confirmed 2026-05-10
  grid_deg: 0.25
  archive_path: "lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/float_img/"
  dem_file: "ldem_85s_40m_float.img"         # float32 PC_REAL (little-endian), values in km
  dem_coverage: "lat ≤ -85° (south polar cap)"
  dem_projection: "south polar stereographic, center at pole"
  slope_range_deg:
    min: 1.80                                # cell-average min (2026-05-10 run)
    max: 33.54
    mean: 9.90
  csetn1_baseline_june2010:
    c_baseline_csetn: 2.9902                 # AVG(csetn1_total) over 71,327 Silver rows
    source: "lunar_ice.south_pole.silver_lend_targets"
  rpi_threshold_note: >
    RPI ≥ 1.5 unachievable at 0.25° cell resolution (min slope 1.8° → max RPI 0.556).
    Threshold meaningful only at pixel-level slopes (Phase 5: PGDA 5m/pix Shackleton DEM).

catalog: lunar_ice
schema: south_pole
volume: raw_pds_blobs
